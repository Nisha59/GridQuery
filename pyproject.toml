[project]
name = "gridquery"
version = "0.1.0"
description = "AI data analyst agent for German electricity data from SMARD"
readme = "README.md"
authors = [
    { name = "Nisha59", email = "nisdc859@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "gradio>=6.29.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.20.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "T20", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
